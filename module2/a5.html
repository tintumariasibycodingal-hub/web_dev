<!DOCTYPE html>
<html>

<head>
  <title>My Animal Fact File</title>
  <style>
    body {
      background-color: black;
      font-family: Arial, sans-serif;
    }

    .fact-file {
      background-color: white;
      color: black;
      width: 260px;
      padding: 25px;
      border: 4px solid black;
      margin: 30px;
    }

    .animal-name {
      color: black;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail {
      color: black;
    }

    .cool-fact {
      color: black;
      font-style: italic;
      font-weight: bold;
      border-top: 1px solid black;
      padding-top: 8px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <center>

    <div class="fact-file">
      <h2 class="animal-name">Peregrine Falcon</h2>
      <p class="detail">Type: Bird of Prey</p>
      <p class="detail">Lives in: Every continent except Antarctica</p>
      <p class="detail">Diet: Smaller birds and bats</p>
      <p class="cool-fact">Cool Fact: Can dive through the air at speeds over 320 km/h!</p>
    </div>


  </center>

</body>

</html>
