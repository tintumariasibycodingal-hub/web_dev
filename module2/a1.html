<!DOCTYPE html>
<html>



<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colour card</title>

  <style>
   
    * {
      font-size: 20px;
    }

  

    h1 {
      color: darkblue;
    }

    h2 {
      color: purple;
    }

    p {
      color: blue;
    }


    .my-detail {
      color: darkgreen;
      font-weight: bold;
    }

    #my-card {
      background-color: black;
    }
  </style>

</head>

<body>

  <h1>My Colour Card</h1>

  <p style="color: maroon;">This is my webpage.</p>

  <div id="my-card">

    <h2>About Me</h2>
    <p class="my-detail">My name is Maria.</p>
    <p class="my-detail">My favourite subject is Maths.</p>
    <p class="my-detail">My favourite food is pasta.</p>

  </div>

  <h2>My Favourite Things</h2>
  <p>My favourite animal is a dog.</p>
  <p>My favourite sport is Football.</p>
 

</body>

</html>
