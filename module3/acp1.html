<!DOCTYPE html>
<html>

<head>
  <title>School Club Website</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- STEP 1 - Bootstrap CSS link -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body {
      background-color: white9;
      font-family: Arial;
      padding: 30px 15px;
    }

    h1 {
      text-align: center;
      color: maroon;
    }

    .club-card h3 {
      color: maroon;
    }

    .club-card {
      text-align: center;
      border: 2px solid maroon;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background-color: white;
    }

  </style>
</head>

<body>

  <h1>My School Clubs</h1>
  <div class="container">
    <div class="row">



      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Coding Club</h3>
          <p>I love programming.</p>
        </div>
      </div>



      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Science Club</h3>
          <p>I enjoy doing experiments.</p>
        </div>
      </div>




      <div class="col-12 col-md-12 col-lg-4">
        <div class="club-card">
          <h3>Art Club</h3>
          <p>I love creating colourful designs.</p>
        </div>
      </div>

    </div>
  </div>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
  </script>

</body>

</html>
